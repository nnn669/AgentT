name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile with concise diagnostics
        shell: bash
        run: |
          set +e
          gradle compileDebugKotlin --no-daemon --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          echo ""
          echo "========== Kotlin compiler diagnostics =========="
          grep -E "(^e: |\.kt:[0-9]+:[0-9]+: error:|FAILURE: Build failed)" compile.log || true
          exit "$status"
      - name: Run unit tests
        if: success()
        run: gradle testDebugUnitTest --no-daemon --console=plain