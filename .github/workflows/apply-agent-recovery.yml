name: apply-agent-recovery

on:
  push:
    paths:
      - '.github/agent-recovery-patch.py'
      - '.github/workflows/apply-agent-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery integration and tests
        run: python3 .github/agent-recovery-patch.py
      - name: Remove one-shot patch files
        run: rm .github/agent-recovery-patch.py .github/workflows/apply-agent-recovery.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: integrate automatic agent recovery"
          git push