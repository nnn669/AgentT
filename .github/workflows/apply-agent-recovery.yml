name: apply-agent-recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery integration and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          chat_path = Path('app/src/main/java/com/agentt/app/ui/chat/ChatScreen.kt')
          text = chat_path.read_text()
          start_marker = '    suspend fun runAgent(provider: ProviderConfig) {'
          end_marker = '\n\n    fun send()'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    suspend fun runAgent(providers: List<ProviderConfig>) {
              var candidates = providers
              val toolResults = mutableListOf<String>()
              repeat(MAX_AGENT_STEPS) {
                  val failedAttempts = mutableListOf<RecoveryAttempt>()
                  val recovery = recoverChatWithProviders(
                      providers = candidates,
                      history = buildAgentHistory(messages.toList(), toolResults),
                      onAttempt = { attempt ->
                          if (attempt.error != null) failedAttempts += attempt
                          loadingLabel = when {
                              attempt.error != null -> "正在切换可用模型"
                              attempt.attempt > 1 -> "正在重试 ${attempt.model}"
                              else -> "调用 ${attempt.model}"
                          }
                      }
                  )
                  if (recovery == null) {
                      addReply(recoveryFailureMessage(failedAttempts), providers.firstOrNull()?.mainModel)
                      return
                  }

                  val provider = recovery.provider
                  val preferred = providers.firstOrNull { it.id == provider.id }
                      ?.copy(models = listOf(recovery.model) + providers.first { it.id == provider.id }.models.filterNot { it == recovery.model })
                      ?: provider
                  candidates = listOf(preferred) + providers.filterNot { it.id == preferred.id }

                  val actions = parseActionStream(recovery.reply.content)
                  if (actions == null || actions.isEmpty()) {
                      addReply(recovery.reply.content, recovery.model)
                      return
                  }
                  var done = false
                  for (a in actions) {
                      when (a.type) {
                          "think" -> {
                              loadingLabel = "分析问题"
                              messages.add(ChatMessage(UUID.randomUUID().toString(), "assistant", a.content, recovery.model, "think"))
                              persist()
                          }
                          "browser" -> {
                              loadingLabel = toolActionLabel(a.tool)
                              val summary = WebTools.runTool(a.tool, a.url, a.query)
                              messages.add(
                                  ChatMessage(
                                      UUID.randomUUID().toString(), "assistant",
                                      "${a.tool}(${a.url ?: a.query})\\n${summary.take(1500)}",
                                      recovery.model, "tool"
                                  )
                              )
                              toolResults.add("[工具 ${a.tool}(${a.url ?: a.query}) 结果]\\n${summary.take(3000)}")
                              if (a.tool == "open" && a.url != null) onOpenBrowser(a.url)
                              persist()
                          }
                          "reply" -> {
                              loadingLabel = "整理回答"
                              addReply(a.content, recovery.model)
                              done = true
                          }
                      }
                  }
                  if (done) return
              }
              addReply("已达到最大执行步数（$MAX_AGENT_STEPS），请把问题拆小后重试。", candidates.firstOrNull()?.mainModel)
          }'''
          text = text[:start] + replacement + text[end:]

          old_send = '''            val provider = providerStore.load().firstOrNull()
                      if (provider == null) {
                          addReply("尚未配置供应商：请到 设置 → 供应商 添加并测试连接后，再开始对话。", null)
                          loading = false
                          return@launch
                      }
                      runAgent(provider)'''
          new_send = '''            val providers = providerStore.load()
                      if (providers.isEmpty()) {
                          addReply("尚未配置供应商：请到 设置 → 供应商 添加并测试连接后，再开始对话。", null)
                          loading = false
                          return@launch
                      }
                      runAgent(providers)'''
          if old_send not in text:
              raise SystemExit('send provider block not found')
          text = text.replace(old_send, new_send, 1)
          chat_path.write_text(text)

          recovery = r'''package com.agentt.app.ui.chat

import com.agentt.app.ui.providers.ProviderConfig
import kotlinx.coroutines.delay

private const val ATTEMPTS_PER_MODEL = 2

data class RecoveryAttempt(
    val provider: String,
    val model: String,
    val attempt: Int,
    val error: String? = null
)

data class RecoveryReply(
    val reply: ChatReply,
    val provider: ProviderConfig,
    val model: String,
    val attempts: List<RecoveryAttempt>
)

/**
 * Tries configured models in provider order. Transient faults get one short
 * backoff retry; permanent request/configuration faults immediately fall back.
 */
suspend fun recoverChatWithProviders(
    providers: List<ProviderConfig>,
    history: List<ChatMessage>,
    onAttempt: (RecoveryAttempt) -> Unit = {},
    request: suspend (ProviderConfig, List<ChatMessage>) -> ChatReply = ::chatWithProvider,
    wait: suspend (Long) -> Unit = { delay(it) }
): RecoveryReply? {
    val attempts = mutableListOf<RecoveryAttempt>()
    val candidates = providers.flatMap { provider ->
        provider.models.asSequence()
            .filter { it.isNotBlank() }
            .distinct()
            .map { model -> provider.copy(models = listOf(model)) }
            .toList()
    }
    for (candidate in candidates) {
        for (attempt in 1..ATTEMPTS_PER_MODEL) {
            val started = RecoveryAttempt(candidate.name, candidate.mainModel, attempt)
            onAttempt(started)
            val reply = request(candidate, history)
            if (reply.ok) {
                attempts += started
                return RecoveryReply(reply, candidate, candidate.mainModel, attempts)
            }
            val failed = started.copy(error = safeError(reply.error))
            attempts += failed
            onAttempt(failed)
            if (!isTransientModelFailure(reply.error) || attempt == ATTEMPTS_PER_MODEL) break
            wait(600L * attempt)
        }
    }
    return null
}

fun isTransientModelFailure(error: String?): Boolean {
    val value = error.orEmpty().lowercase()
    if (value.isBlank()) return false
    val status = Regex("http\\s+(\\d{3})", RegexOption.IGNORE_CASE)
        .find(value)?.groupValues?.getOrNull(1)?.toIntOrNull()
    if (status != null) return status in setOf(408, 409, 425, 429) || status >= 500
    return true
}

fun safeError(error: String?): String {
    val value = error.orEmpty()
        .replace(Regex("(?i)([?&](?:key|api_key)=)[^&\\s]+"), "$1***")
        .replace(Regex("(?i)(\\\"?(?:api[_ -]?key|authorization|x-api-key)\\\"?\\s*[:=]\\s*\\\"?)[^\\\"\\s,}]+"), "$1***")
        .replace(Regex("(?i)(bearer\\s+)[A-Za-z0-9._~+/=-]+"), "$1***")
    return when {
        value.contains("SocketException", ignoreCase = true) ||
            value.contains("connection abort", ignoreCase = true) ||
            value.contains("connection reset", ignoreCase = true) ||
            value.contains("unexpected end", ignoreCase = true) -> "网络连接中断"
        value.contains("timeout", ignoreCase = true) || value.contains("timed out", ignoreCase = true) -> "请求超时"
        value.contains("HTTP 429", ignoreCase = true) -> "请求过于频繁"
        value.contains("HTTP 401", ignoreCase = true) || value.contains("HTTP 403", ignoreCase = true) -> "凭据无效或无权限"
        value.contains("HTTP 404", ignoreCase = true) -> "模型或服务地址不存在"
        Regex("(?i)HTTP 5\\d\\d").containsMatchIn(value) -> "服务暂时不可用"
        else -> value.take(120).ifBlank { "未知调用错误" }
    }
}

fun recoveryFailureMessage(attempts: List<RecoveryAttempt>): String {
    val failures = attempts.filter { it.error != null }
    val details = failures.distinctBy { Triple(it.provider, it.model, it.error) }
        .take(4)
        .joinToString("\n") { "• ${it.provider} / ${it.model}：${it.error}" }
    val header = "⚠️ AgentT 已自动重试并尝试备用模型/供应商，但暂时仍无法完成请求。"
    return if (details.isBlank()) "$header\n请检查网络和供应商配置后重试。" else "$header\n$details"
}
'''
          Path('app/src/main/java/com/agentt/app/ui/chat/AgentRecovery.kt').write_text(recovery)

          test = r'''package com.agentt.app.ui.chat

import com.agentt.app.ui.providers.ProviderConfig
import kotlinx.coroutines.runBlocking
import org.junit.Assert.assertEquals
import org.junit.Assert.assertFalse
import org.junit.Assert.assertNotNull
import org.junit.Assert.assertTrue
import org.junit.Test

class AgentRecoveryTest {
    private fun provider(name: String, models: List<String>) = ProviderConfig(
        id = name, name = name, protocol = "openai",
        baseUrl = "https://example.com/v1", apiKey = "secret", models = models
    )

    @Test
    fun retriesTransientThenFallsBackToNextModel() = runBlocking {
        val calls = mutableListOf<String>()
        val result = recoverChatWithProviders(
            providers = listOf(provider("主供应商", listOf("broken", "backup"))),
            history = emptyList(),
            request = { p, _ ->
                calls += p.mainModel
                if (p.mainModel == "backup") ChatReply(true, "ok", null)
                else ChatReply(false, "", "HTTP 503 unavailable")
            },
            wait = {}
        )
        assertNotNull(result)
        assertEquals("backup", result!!.model)
        assertEquals(listOf("broken", "broken", "backup"), calls)
    }

    @Test
    fun permanentCredentialFailureDoesNotWasteRetry() = runBlocking {
        val calls = mutableListOf<String>()
        val result = recoverChatWithProviders(
            providers = listOf(provider("A", listOf("first")), provider("B", listOf("second"))),
            history = emptyList(),
            request = { p, _ ->
                calls += p.mainModel
                if (p.mainModel == "second") ChatReply(true, "ok", null)
                else ChatReply(false, "", "HTTP 401 key=do-not-leak")
            },
            wait = {}
        )
        assertEquals(listOf("first", "second"), calls)
        assertEquals("B", result!!.provider.name)
    }

    @Test
    fun classifiesRetryableHttpStatuses() {
        assertTrue(isTransientModelFailure("HTTP 429"))
        assertTrue(isTransientModelFailure("HTTP 503"))
        assertFalse(isTransientModelFailure("HTTP 400"))
        assertFalse(isTransientModelFailure("HTTP 401"))
    }

    @Test
    fun redactsCredentialsAndBuildsReadableFailure() {
        val safe = safeError("HTTP 401 https://x.test?key=abc123 Authorization: Bearer token456")
        assertFalse(safe.contains("abc123"))
        assertFalse(safe.contains("token456"))
        val message = recoveryFailureMessage(listOf(RecoveryAttempt("P", "M", 1, "请求超时")))
        assertTrue(message.contains("已自动重试"))
        assertTrue(message.contains("P / M"))
    }
}
'''
          test_path = Path('app/src/test/java/com/agentt/app/ui/chat/AgentRecoveryTest.kt')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test)
          Path('.github/workflows/apply-agent-recovery.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: integrate automatic agent recovery"
          git push