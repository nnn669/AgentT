name: Apply AgentT step labels

'on': [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chat operation labels
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/agentt/app/ui/chat/ChatScreen.kt')
          text = path.read_text()
          replacements = {
              'var loading by remember { mutableStateOf(false) }': 'var loading by remember { mutableStateOf(false) }\n    var loadingLabel by remember { mutableStateOf("分析问题") }',
              'loading = false\n    }\n\n    // Auto-follow': 'loading = false\n        loadingLabel = "分析问题"\n    }\n\n    // Auto-follow',
              '"think" -> {\n                        messages.add': '"think" -> {\n                        loadingLabel = "分析问题"\n                        messages.add',
              '"browser" -> {\n                        val summary': '"browser" -> {\n                        loadingLabel = toolActionLabel(a.tool)\n                        val summary',
              '"reply" -> {\n                        addReply': '"reply" -> {\n                        loadingLabel = "整理回答"\n                        addReply',
              'loading = true\n        scope.launch': 'loading = true\n        loadingLabel = "分析问题"\n        scope.launch',
              'Text("Agent 助手",': 'Text("AgentT 助手",',
              '"你好，我是你的 Agent 助手\\n在下方输入消息开始对话"': '"你好，我是 AgentT\\n在下方输入消息开始对话"',
              'if (loading) item { AgentThinking() }': 'if (loading) item { AgentThinking(loadingLabel) }',
              'Text("Agent", style =': 'Text("AgentT", style =',
              'Text("思考", style =': 'Text("分析问题", style =',
              'private fun AgentThinking() {': 'private fun AgentThinking(label: String) {',
              'Text("Agent 正在执行动作流…", style =': 'Text(label, style =',
              'Text("给 Agent 发送消息…",': 'Text("给 AgentT 发送消息…",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected source: {old[:80]!r}')
              text = text.replace(old, new, 1)
          old_tool = "@Composable\nprivate fun ToolCard(content: String) {\n    Surface("
          new_tool = "@Composable\nprivate fun ToolCard(content: String) {\n    val call = content.substringBefore('\\n')\n    val tool = call.substringBefore('(')\n    val target = call.substringAfter('(', \"\").substringBeforeLast(')', \"\")\n    val result = content.substringAfter('\\n', \"\")\n    Surface("
          if old_tool not in text:
              raise SystemExit('Missing ToolCard declaration')
          text = text.replace(old_tool, new_tool, 1)
          old_body = 'Text("网页工具", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold)\n            }\n            Spacer(Modifier.height(6.dp))\n            Text(content, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          new_body = 'Text(toolActionLabel(tool), style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold)\n            }\n            if (target.isNotBlank()) {\n                Spacer(Modifier.height(4.dp))\n                Text(target, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 2)\n            }\n            if (result.isNotBlank()) {\n                Spacer(Modifier.height(6.dp))\n                Text(result, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n            }'
          if old_body not in text:
              raise SystemExit('Missing ToolCard body')
          text = text.replace(old_body, new_body, 1)
          marker = '@Composable\nprivate fun AgentThinking(label: String) {'
          helper = 'private fun toolActionLabel(tool: String): String = when (tool.lowercase()) {\n    "search" -> "搜索网页"\n    "extract" -> "读取网页正文"\n    "title" -> "获取网页标题"\n    "links" -> "提取网页链接"\n    "open" -> "打开网页"\n    else -> "执行网页操作"\n}\n\n@Composable\nprivate fun AgentThinking(label: String) {'
          if marker not in text:
              raise SystemExit('Missing AgentThinking marker')
          text = text.replace(marker, helper, 1)
          path.write_text(text)
          Path('.github/workflows/apply-agentt-step-labels.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/agentt/app/ui/chat/ChatScreen.kt .github/workflows/apply-agentt-step-labels.yml
          git commit -m "feat: show AgentT-specific operation labels"
          git push