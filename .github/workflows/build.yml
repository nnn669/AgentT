name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 构建 Debug APK
        run: gradle assembleDebug

      - name: 上传 APK 到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentT-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 30