name: build-apk

on:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore if not exists
        run: |
          if [ ! -f app/agentt.keystore ]; then
            echo "🔑 Generating new keystore for persistent signing..."
            keytool -genkey -v -keystore app/agentt.keystore \
              -alias agentt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass agenttpass -keypass agenttpass \
              -dname "CN=AgentT, OU=Development, O=AgentT, L=Unknown, ST=Unknown, C=UN"
            ls -la app/agentt.keystore
            echo "✅ Keystore generated. Committing to repo..."
            git config user.name "AgentT Builder"
            git config user.email "builder@agentt.app"
            git add app/agentt.keystore
            git commit -m "Add persistent keystore for build signing"
            git push
          else
            echo "✅ Keystore already exists, reusing for persistent signing"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify tests then build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK to artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Build
          body: 每次确认构建后更新的 APK（直接下载，无需解压）
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true