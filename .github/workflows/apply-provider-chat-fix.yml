name: apply-provider-chat-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Route provider test and chat through the reliable client
        shell: python
        run: |
          from pathlib import Path

          chat = Path("app/src/main/java/com/agentt/app/ui/chat/ChatScreen.kt")
          text = chat.read_text()
          replacements = {
              'val result = chatWithProvider(p, listOf(ChatMessage("sys", "system", systemPrompt)) + history)':
                  'val result = chatWithProviderReliable(p, history, systemPrompt)',
              'e.contains("401") || e.contains("403") || e.contains("40") ||':
                  'e.contains("401") || e.contains("403") ||',
              'onAttempt(attemptInfo.copy(error = "配置错误，跳过此供应商"))':
                  'onAttempt(attemptInfo.copy(error = "配置错误：${result.error?.take(180) ?: "未知错误"}"))',
              'onAttempt(attemptInfo.copy(error = "请求失败，${provider.models.size - attempt}个备用模型可尝试"))':
                  'onAttempt(attemptInfo.copy(error = result.error?.take(180) ?: "请求失败"))',
              'runAgent(providers, systemPrompt)':
                  'runAgent(prioritizeAssistantModel(providers, assistant), systemPrompt)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence, got {count}: {old}")
              text = text.replace(old, new)
          chat.write_text(text)

          providers = Path("app/src/main/java/com/agentt/app/ui/providers/ProvidersScreen.kt")
          text = providers.read_text()
          old = "val r = testProviderApi(p)"
          new = "val r = com.agentt.app.ui.chat.testProviderConversation(p)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one provider test call, got {text.count(old)}")
          providers.write_text(text.replace(old, new))

          # 本工作流仅用于安全地完成一次精确补丁，应用后自删除。
          Path(".github/workflows/apply-provider-chat-fix.yml").unlink()
      - name: Commit source patch
        run: |
          git config user.name "AgentT Builder"
          git config user.email "builder@agentt.app"
          git add app/src/main/java/com/agentt/app/ui/chat/ChatScreen.kt \
                  app/src/main/java/com/agentt/app/ui/providers/ProvidersScreen.kt \
                  .github/workflows/apply-provider-chat-fix.yml
          git commit -m "fix: route conversations through reliable provider client"
          git push
